[package]
name = "logmix"
version = "0.1.0"
edition = "2021"
description = "Merge structured log streams by timestamp (JSONL, logfmt, plain text)"
license = "MIT"
repository = "https://github.com/malisetti/logmix"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "logmix"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
predicates = "3"
serde_json = "1"
